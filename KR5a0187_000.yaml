front:
  text: 二經同卷雨十一
  hash: sha256:7a67aa331ee31a43bf52e462cf8666ce7e954b4c31e4401f984a1a870b605b51
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0187_HFL_000-001a, image: hfl/0078/0078-138.png}
body:
  text: 太微仙君功過格太清五十八願文太微仙君功過格序易曰積善之家必有餘慶積不善之家必有餘殃道科曰積善則降之以祥造惡則責之以禍故儒道之教一無異也古者聖人君子髙道之士皆著盟誡內則洗心錬行外則訓誨於人以備功業矣余於大定辛卯之歲仲春二日子正之時夢逰紫府朝禮太微仙君得受功過之格令傳信心之士匆然夢覺遂思功過條目歷歷明了尋乃披衣正坐默而思之知是髙仙降靈不敢踈慢遂整衣戴冠滌硯揮箋走筆書之不時而就皆出乎無思非干於用意著斯功格三十六條過律三十九條各分四門以明功過之數付修真之士明書日月自記功過一月一小比一年一大比自知功過多寡與上天真司考校之數昭然相契悉無異焉大凡一日之終書功下筆乃易書過下筆的難即使聰明之士明然頓悟罪福因緣善惡門戶知之減半慎之全無依此行持逺惡遷善誠為真誡去仙不逺矣西山會真堂無憂軒又玄子序太微仙君功過格功格三十六條救濟門十二條教典門七條焚修門五條用事門十二條過律三十九條不仁門十五條不善門八條不義門十條不軌門六條凡受持之道常於寢室床首置筆硯簿籍先書月分次書日數於日下開功過兩行至臨卧之時記終日所為善惡照此功過格內名色數目有善則功下注有惡則過下注之不得明功隱過至月終計功過之總數功過相比或以過除功或以功折過折除之外者明見功過之數當書總記訖再書後月至一年則大比自知罪福不必問乎休咎功格三十六條救濟門十二條以符法針藥救重疾一人為十功小疾一人為五功如受病家賄賂則無功治邪一同凡行治一度為一功施藥一服為一功傳一符一法一方一術令人積行救人每一術為十功如受賄而傳或令人受賄則並無功傳人保益性命符法藥術等每一事為五功如受賄而傳為一功救一人刑死性命為百功免死刑性命一人為百功減死刑性命一人為五十功救人徒刑為四十功免人徒刑為三十功減人徒刑為二十功救人杖刑為十功免人杖刑為八功減人杖刑為六功救人笞刑為五功免人笞刑為四功減人笞刑為三功赦謂非自己主事得門竭力救之是也免謂自己主事特與原免者是也如依法定罪則無功如私家減免婢㒒之屬同此論功救有力報人之畜一命為十功謂駝騾牛馬驢畜等救無力報人之畜一命為八功謂山野禽獸之屬蟲蟻飛蛾濕生之類一命為一功賑濟鰥寡孤獨窮民百錢為一功貫錢為十功如一錢散施積至百錢為一功米麥幣帛衣物以錢數論功饒潤窮民債負亦同此論濟飢渴之民一飲一食皆為一功濟寒凍之民暖室一宵為一功救接人畜筋力疲困之苦一時為一功葬無主之骨一人為五十功施地與無土之家葬一人為三十功若令出備租課則無功埋藏自死者走獸飛禽六畜等一命為一功若埋藏禽獸六畜骨殖及十六斤為一功平理道途嶮阻及泥水陷沒之所一日一人之功為十功若造船橋濟渡不求賄賂者所費百錢為一功一日一人之功為十功教典門七條自己受救人法籙經教一宗為二十功受保護自身法籙經教一宗為十五功於髙士處求救人法籙經教一宗為八功求保護自身法籙經教一宗為四功傳受行法官一人為百功度籙生弟子一人為五十功度受戒弟子一人為三十功以救衆經法付人為五功保養性命經法付人為四功演道經論付人為三功為朋友間相受也自己注撰救衆經法一宗為三十功保養性命經法一宗為二十功謂得功驗者讃道之文一篇為一功謂詩詞歌頌等若詠無教化者則無功自己簡編救衆經法一宗為十功保養性命經法一宗為五功讃道之文一篇為一功雕造經教所費百錢為一功貫錢為十功印造散施與人小經一卷為十功謂千字已下者大經一卷為二十功謂千字巳上者並謂上聖正典有教化者非談論興亡勝敗之書及詠風月之文焚修門五條修聖像壇宇幢蓋幡花器皿床坐及諸供養之物費百錢為一功貫錢為十功如施與人錢物修置百錢為半功貫錢為五功或以什物一件為一功旦夕朝禮為國為衆焚修一朝為二功為己焚修一朝為一功章醮為國為民為祖先為孤魂為尊親祈禳災害薦拔況魂一分為二功為已一分為一功為施主一分為一功若受法信則無功為無告孤魂告行拔亡符命一符為十功祖先尊親一亡為十功為平交親知及卑幼一亡為五功為施主一亡為四功若受法信則無功為國為民或尊親先亡或無主孤魂誦大經一卷為六功小經一卷為三功聖號百遍為三功為平交親知及卑幼誦大經為四功小經聖號為二功為施主誦大經一卷為三功小經聖號為一功若受法信則無功為己禳謝誦大經一卷為二功小經聖號為一功用事門十二條興諸善事利益一人為一功講演經教及諸善言化諭於衆在席十人為一功百人為十功人數雖多止五十功以文章詩詞誡勸於衆一篇為一功化人出財修諸功德一貫為一功勸人官門鬪訟免死刑為十功免徒刑為五功免杖刑為二功免笞刑為一功勸諌人鬪爭一人為一功舉薦髙明賢達有德之士用事一人為十功讃揚人之善道一事為一功掩遏人之惡業一事為一功勸諌人令不為非不廉不孝不貞不良不善不慈不仁不義一人回心為十功自己著𥿄衣一件為二功著布素粗衲之衣一件為一功謂有而不著者是功著紈帛者無功自己飲膳有而不食者為三功晚而不食者為二功素食下味為一功素食中味為半功素食上味為無功謂有上味及素饌佳肴而故不食者止甘淡薄粗糲中下之味者為功若無上味而食中等之味者非為功若無中味而食下味者亦非為力蓋有而故不食者為功過律三十九條不仁門十五條凡有重疾告治不為拯救者一人為二過小疾一人為一過治不如法為一過不愈而受賄百錢為一過貫錢為十過修合毒藥欲害於人為十過害人性命為百過害人不死而病為五十過害一切衆生禽畜性命為十過害而不死為五過舉意欲害為一過學厭禱呪咀邪法欲害於人為十過害人性命為百過害人不死而病為五十過害人六畜一命為十過令病為五過舉意欲害為一過厭禳人家令見怪異欲取財賄為十過得財百錢為一過貫錢為十過謀人死刑成者為百過不成為五十過舉意不作為十過謀人徒刑成者為四十過不成為二十過舉意不作為八過謀人杖刑為十過不成為八過舉意為五過謀人笞刑為三過不成為四過舉意為三過凡為官吏入人罪者同此論為行法官妄入鬼神罪者亦同此論心中暗舉惡事欲殘害於人一人為一過事成殘害一人為十過心意中邪淫雜想非理之事一事為一過凡言舉惡事欲殘害於人一人為一過事成為十過惡語向師長尊親為十過向善人為八過向平交為四過向卑幼為一過言約失信為一過揚人惡事為一過掩人善事為一過故傷殺人性命為百過誤傷殺性命為八十過以言遽殺者同使人殺者為六十過故殺有力報人之畜一命為十過誤殺為五過故殺無力報人之畜飛禽走獸之類一命為八過誤殺為四過故殺蟲蟻飛蛾濕生之屬一命為二過誤殺為一過故殺傷人害物者惡獸毒蟲為一過謂虎狼蛇蝎毒蟲之屬使人殺者同上論見殺不救隨本人之過減半無門可校不生慈念為二過助讃殺生為五過見若救得而不救者為十過無門可救不生慈念者為一過見人有憂不行解釋而故暢快者為五過見人畜死不起慈念者為一過凡言慈念者謂見苦不能得救止以持念聖號經文回向以結善緣也役使人畜至於疲乏力倦不矜其苦而剛使役者一時為十過加之鞭笞者一杖為一過用水陷溺路徑使人畜出入行履艱難者一時為十過摧毀船橋使不通渡者一時為十過不善門八條毀壞功德聖像壇宇幢蓋幡花器皿床具及諸獻供之物百錢之直為一過貫錢之直為十過以巧言説人毀壞百錢之直為半過貫錢之直為五過見而不觀為一過讃助為五過以言指斥毀天尊聖像為二十過真人為十五過神君為十過見毀滅不勸為一過讃助毀滅為五過毀滅經教與此同論每遇齋日及諸節令吉辰故不朝真為二過因私務不及并非齋日為一過因公務不及無過為食酒肉葷辛及犯觸不朝真為五過忌日誤朝真為一過遇節辰食晚食為二過常日晚食為一過齋醮供聖鎮信之物一物不備為一過章詞一字差錯為一過誤違科律格式一事為一過威儀有失一事為一過唱念不專為一過宣科讀狀奏對詞表差錯一字為一過三時朝真一時有失為五過供養進獻之物一物不備為一過一物不潔為一過及不如法為一過應受施主法信錢物非理使用百錢為一過貫錢為十過薦亡符簡文字等一字差錯為一過脫漏一字為一過符文差錯脫漏為十過修寫書篆不如法為五過誦念經典漏一字為一過漏一句為五過音釋乖背字音交差一字為一過念誦語句錯亂有失文意一句為五過若念誦之時心意不專為五過邪淫雜想及思惡事為十過住經語惡事訖續念經為十過語常事為五過接陪賔侣為三過語善事為一過不依誦經法式為五過念經發嗔怒為十過凌辱他人為十過凡言十過其功全無並是虛念伹一過去功一分十過去功十分所以不用也不義門十條教唆人官門鬪訟死刑為三十過徒刑為二十過杖罪為十過笞罪為八過教唆人鬪爭一人為一過教人為不廉不孝不義不仁不善不慈為非作過一事為一過見賢不薦為一過見賢不師為一過見明師不參授典教為二過不依師之教旨為十過反叛師長為五十過違師教公為三十過尊長父母同此論良朋勝友不交設為一過窮民不濟為一過復加凌辱一人為三過偷盜人財物或教人偷盜百錢為一過貫錢為十過若見偷盜不勸為一過讃助偷盜為五過米麥幣帛衣服並論錢數定過不義而取人財物百錢為一過貫錢為十過欠人財物抵諱不還百錢為一過貫錢為十過因而謀害其過加陪不軌門六條傳教法隱真出偽欺罔弟子一事為五過如受法信百錢為一過得人不傳為一過傳非其人為十過注撰煙粉傳記詩詞歌行一篇為二過傳與一人為二過簡編一篇為一過傳與一人為一過自己記念一篇為一過食肉故殺性命食之為六過買肉食之為三過違禁肉故食為六過誤食為三過過齋日食之為十過食後入壇念善為十過飲酒為評議惡事與人飲一升為六過無故與不良人飲一升為二過無故與常人飲一升為一過助淫歡飲一升為十過為和合事理與友人飲祭酒待賔服藥皆不坐遇齋日飲致醉或酒後入壇念善為五過五辛無故食之一食為一過食後持念經一大卷為十過一小經為五過一聖號為一過齋日食之為五過受觸極親為五十過近親為三十過逺親為二十過良家為十五過受觸之後入壇念道朝真禮聖及齋日犯觸隨儀每一過為五過太微仙君功過格終
